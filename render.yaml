services:
  - type: web
    name: cricanalytics
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && cd frontend && npm install && npm run build && cd ..
    startCommand: gunicorn CricAnalytics.wsgi:application --log-file -
    healthCheckPath: /api/
    envVars:
      - key: DEBUG
        value: false
      - key: PYTHON_VERSION
        value: "3.10"
    envVarFile: ../.env
