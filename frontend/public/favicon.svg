<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#141c2e"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>
    <linearGradient id="batBladeGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%"   stop-color="#ffd060"/>
      <stop offset="40%"  stop-color="#f0b429"/>
      <stop offset="100%" stop-color="#8c6010"/>
    </linearGradient>
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#d4d4d4"/>
      <stop offset="100%" stop-color="#888"/>
    </linearGradient>
    <radialGradient id="ball3" cx="35%" cy="30%" r="60%">
      <stop offset="0%"   stop-color="#e85555"/>
      <stop offset="100%" stop-color="#900f10"/>
    </radialGradient>
    <filter id="batShadow">
      <feDropShadow dx="1" dy="1" stdDeviation="1" flood-color="#f0b429" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#bg3)"/>
  <rect width="32" height="32" rx="7" fill="none" stroke="#f0b429" stroke-width="0.5" stroke-opacity="0.35"/>

  <!-- Bat (angled ~40deg, blade facing top-right) -->
  <g transform="rotate(-40, 16, 16)" filter="url(#batShadow)">
    <!-- Blade -->
    <rect x="12" y="4" width="8" height="17" rx="2.5" fill="url(#batBladeGrad)"/>
    <!-- Shoulder taper -->
    <path d="M12 20 Q10.5 21 11 22 L13 22 L12 20Z" fill="#c8901a"/>
    <path d="M20 20 Q21.5 21 21 22 L19 22 L20 20Z" fill="#c8901a"/>
    <!-- Blade ridge centre line -->
    <line x1="16" y1="5" x2="16" y2="19" stroke="#c8901a" stroke-width="0.7" stroke-opacity="0.6"/>
    <!-- Grain lines -->
    <line x1="13.5" y1="6"  x2="13.5" y2="18" stroke="#c8901a" stroke-width="0.3" stroke-opacity="0.4"/>
    <line x1="18.5" y1="6"  x2="18.5" y2="18" stroke="#c8901a" stroke-width="0.3" stroke-opacity="0.4"/>
    <!-- Handle -->
    <rect x="14.2" y="21" width="3.6" height="8" rx="1.8" fill="url(#handleGrad)"/>
    <!-- Grip tape wraps -->
    <line x1="14.2" y1="23"   x2="17.8" y2="23"   stroke="#555" stroke-width="0.7"/>
    <line x1="14.2" y1="25"   x2="17.8" y2="25"   stroke="#555" stroke-width="0.7"/>
    <line x1="14.2" y1="27"   x2="17.8" y2="27"   stroke="#555" stroke-width="0.7"/>
  </g>

  <!-- Ball (bottom left, partially behind bat) -->
  <circle cx="9.5" cy="23.5" r="5" fill="url(#ball3)"/>
  <path d="M9.5 18.5 C7.5 19.5, 7.5 21.5, 9.5 23.5 C11.5 25.5, 11.5 27.5, 9.5 28.5"
    stroke="#f0b429" stroke-width="0.7" fill="none" stroke-opacity="0.6"/>
  <circle cx="8" cy="21" r="0.9" fill="#fff" fill-opacity="0.2"/>
</svg>
